# kist-ext-sensor-io — single config file, one section per sensor
# (same convention as kist-gearsonic-inference / kist-navigation-planner)

unitree:
  # DDS domain id (default 0; must match the consumers')
  domain_id: 0
  # Network interface toward the consumers. On the G1 onboard PC this is
  # the robot-LAN interface; use "lo" for same-machine testing.
  network_interface: eno2

uwb:
  enabled: true
  # Decawave DWM dongle (udev symlink — see README)
  serial_port: /dev/uwb
  serial_baud: 115200
  # frame_id stamped on published fixes (UWB local frame)
  frame_id: map

# Settings shared by every camera. Any `realsense_cameras` entry may override a
# field (e.g. a wrist D405 dropping to 640x480 for USB budget). Keeps per-camera
# entries down to name + serial.
realsense_defaults:
  # RealSense capture — depth (Z16) + color (BGR8)
  depth_width: 640
  depth_height: 480
  depth_fps: 30
  color_width: 640
  color_height: 480
  color_fps: 30
  align_to_color: true           # reproject depth into the color frame

  # Depth spatial (edge-preserving) filter — disable to skip
  spatial_filter:
    enabled: true
    magnitude: 2                 # filter passes, 1..5
    smooth_alpha: 0.5            # neighbor weight, 0..1
    smooth_delta: 20.0           # depth-discontinuity tolerance (mm)

  # H.264 color encoder (x264)
  color_bitrate_kbps: 4000
  color_keyframe_interval: 30    # IDR every N frames (= fps -> 1/s)
  color_preset: ultrafast        # ultrafast..placebo (speed vs size)
  color_tune: zerolatency        # real-time streaming
  color_profile: baseline        # widest compatibility, no B-frames

# One entry per physical camera. `name` namespaces the DDS topics
# (rt/kist/camera/<name>/color/h264, .../depth/rvl) and defaults the frame_ids
# (<name>_depth / <name>_color); `serial` picks the device (rs-enumerate-devices
# lists them). A runner spawns one Transmitter/Receiver per entry. Only name +
# serial are needed — add any realsense_defaults field here to override it.
realsense_cameras:
  - name: head
    enabled: true
    serial: ""                   # empty = first available device

  # - name: left_wrist
  #   serial: "230322270123"     # D405; smaller res for USB budget
  #   color_width: 640
  #   color_height: 480
  #   depth_width: 640
  #   depth_height: 480
